<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*
        # = id
        . = class
        : = pseudo-classe
        :: = pseudo-element
        > = filho
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: blueviolet;
            text-decoration: none;
            font-style: bold;
        }

        a:visited {
            color: rgb(54, 7, 97);
        }

        a:hover {
            text-decoration: underline;
        }

        a:active {
            color: blue;
        }

        .especial::before {
            content: " ⇒ ";
        }
        .especial::after {
            content: " ⇐ ";
        }

        .especial
        {
            background-color: rgb(255, 146, 164);
            color: white;
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/icarosouza04" target="_blank" class="especial">Repositório do GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/icarosouza04/" target="_blank" class="especial">Perfil do LinkedIn</a></li>
        <li><a href="https://www.instagram.com/icaro_souza4/" target="_blank" class="especial">Perfil do Instagram</a></li>
    </ul>
</body>
</html>
