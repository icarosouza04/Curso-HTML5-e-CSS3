<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#cxA {
            flex: 0 1 auto; /* ou flex: initial; */
        }

        div#cxB {
            flex: 0 0 auto; /* ou flex: none; */
        }

        div#cxC {
            flex: 1 1 auto; /* ou flex: auto; */
        }

        div#cxD {
            flex: 3; /* ou flex: 3 1 auto; */
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
        <div class="item" id="cxD">D</div>
    </div>
</body>
</html>
